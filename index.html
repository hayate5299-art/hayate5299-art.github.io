<!doctype html>
<html lang="ja" data-design="chic">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>自創作・代理まとめ HTML版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; }

      /* ---------- デザインテーマ（CSS変数） ---------- */
      :root {
        --radius: 10px; --radius-lg: 14px;
        --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
        --font-head: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
      }
      :root, :root[data-design="chic"] {
        --bg:#f7f7f5; --surface:#ffffff; --surface2:#efefec; --ink:#17171a; --ink2:#4c4d52;
        --line:#d8d8d3; --accent:#17171a; --accent-ink:#ffffff; --chip:#ececea; --danger:#b3352c;
        --radius:8px; --radius-lg:10px; --font-head:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-design="chic"] {
          --bg:#0e0e10; --surface:#17181b; --surface2:#222329; --ink:#f0f0ee; --ink2:#b0b1b6;
          --line:#35363d; --accent:#f0f0ee; --accent-ink:#141416; --chip:#232429; --danger:#e58a83;
        }
      }
      :root[data-design="kawaii"] {
        --bg:#fdf3f6; --surface:#ffffff; --surface2:#fbe9ef; --ink:#452a38; --ink2:#7d5568;
        --line:#f0cdd9; --accent:#c94f7c; --accent-ink:#ffffff; --chip:#fbe0ea; --danger:#b3352c;
        --radius:16px; --radius-lg:20px; --font-head:"M PLUS Rounded 1c","Zen Kaku Gothic New",sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-design="kawaii"] {
          --bg:#221319; --surface:#2e1a23; --surface2:#3a2230; --ink:#f9e6ee; --ink2:#d3a9bc;
          --line:#52303f; --accent:#ef9dbd; --accent-ink:#33101f; --chip:#402631; --danger:#f0a49d;
        }
      }
      :root[data-design="pop"] {
        --bg:#fdf6d3; --surface:#ffffff; --surface2:#fff3c4; --ink:#23242a; --ink2:#5a5b52;
        --line:#e7d488; --accent:#e8490f; --accent-ink:#ffffff; --chip:#ffeeb0; --danger:#c22e2e;
        --radius:12px; --radius-lg:16px; --font-head:"M PLUS Rounded 1c","Zen Kaku Gothic New",sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-design="pop"] {
          --bg:#17181f; --surface:#22232c; --surface2:#2d2e26; --ink:#f6f2df; --ink2:#b9bba6;
          --line:#45452f; --accent:#ff8a5f; --accent-ink:#2a1005; --chip:#33331f; --danger:#f09a8d;
        }
      }
      :root[data-design="natural"] {
        --bg:#f3f6ee; --surface:#ffffff; --surface2:#e9efe0; --ink:#2c382a; --ink2:#57654f;
        --line:#cfdbc0; --accent:#446b3c; --accent-ink:#ffffff; --chip:#e4edd7; --danger:#b3352c;
        --radius:12px; --radius-lg:16px; --font-head:"Zen Kaku Gothic New",sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-design="natural"] {
          --bg:#12160f; --surface:#1b2117; --surface2:#252d1f; --ink:#eaf0e2; --ink2:#aebba2;
          --line:#37422f; --accent:#9cc489; --accent-ink:#15210f; --chip:#26301f; --danger:#f0a49d;
        }
      }
      :root[data-design="gorgeous"] {
        --bg:#f7f2e6; --surface:#fffdf6; --surface2:#f1e8d0; --ink:#2b2113; --ink2:#6d5a3a;
        --line:#d9c896; --accent:#8a6a14; --accent-ink:#fff6da; --chip:#efe4c2; --danger:#a52a21;
        --radius:6px; --radius-lg:8px; --font-head:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-design="gorgeous"] {
          --bg:#0a0a09; --surface:#15140f; --surface2:#201d13; --ink:#f2e8cd; --ink2:#bfab7d;
          --line:#54451f; --accent:#cfa92e; --accent-ink:#1a1403; --chip:#26200e; --danger:#f09a8d;
        }
      }

      body {
        background: var(--bg); color: var(--ink);
        font-family: var(--font-body); font-size: 15px; line-height: 1.65;
      }
      .wrap { max-width: 1060px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 28px) 72px; }
      h1, h2, h3 { font-family: var(--font-head); line-height: 1.35; margin: 0; }
      button { font-family: inherit; cursor: pointer; }
      input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }
      a { color: var(--accent); }

      /* ---------- ボタン ---------- */
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        min-height: 40px; padding: 6px 14px; border: 1px solid var(--line);
        background: var(--surface); color: var(--ink); border-radius: var(--radius);
        font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap;
      }
      .btn:active { transform: translateY(1px); }
      .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
      .btn-small { min-height: 36px; padding: 4px 10px; font-size: 13px; }
      .btn-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
      .btn-ghost { border-color: transparent; background: transparent; }
      .btn[disabled] { opacity: .45; cursor: default; }

      /* ---------- ツールバー・検索・チップ ---------- */
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
      .searchbox { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 12px; }
      .searchbox input { flex: 1; border: none; background: transparent; min-height: 42px; outline: none; }
      .preview-badge { display: none; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
      body.preview .preview-badge { display: inline-block; }
      .chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
      .chip {
        min-height: 36px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line);
        background: var(--surface); color: var(--ink); font-size: 13.5px;
      }
      .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
      .chip .cnt { opacity: .75; font-size: 12px; margin-left: 4px; }
      .tagchip {
        display: inline-flex; align-items: center; min-height: 32px; padding: 2px 10px;
        border-radius: 999px; background: var(--chip); color: var(--ink); font-size: 13px; border: 1px solid transparent;
      }
      button.tagchip { cursor: pointer; }
      .tagchip.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
      .marksrow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
      .markitem { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; padding: 2px 7px; border-radius: 999px; background: var(--chip); color: var(--ink); font-size: 16.5px; line-height: 1; }
      .markitem.hasnote { cursor: pointer; position: relative; border: 1px solid var(--line); padding-right: 13px; }
      .markitem.hasnote::after { content: ""; position: absolute; top: 4px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
      .markitem.hasnote:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .markchip.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
      .marknote-ind { font-size: 10.5px; font-weight: 700; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 6px; margin-left: 3px; line-height: 1.5; }
      .marknote-box { background: var(--surface2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin: 2px 0 12px; }
      .marknote-box textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 9px 11px; min-height: 84px; resize: vertical; line-height: 1.6; }
      .markedit { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .markchip { display: inline-flex; align-items: center; gap: 2px; min-height: 36px; padding: 3px 6px 3px 10px; border-radius: 999px; background: var(--chip); color: var(--ink); border: 1px solid transparent; }
      .markchip .markglyph { font-size: 19px; line-height: 1; }
      .markchip button { border: none; background: none; color: inherit; min-height: 28px; padding: 0 4px; font-size: 14px; cursor: pointer; }
      .markpresetrow { display: flex; flex-wrap: wrap; gap: 6px; }
      .markpreset { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 19px; line-height: 1; cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
      .rowlabel { font-size: 12.5px; color: var(--ink2); margin: 2px 0 6px; letter-spacing: .04em; }

      /* ---------- 一覧カード ---------- */
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 235px), 1fr)); gap: 14px; }
      @media (max-width: 620px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
      @media (max-width: 350px) { .grid { grid-template-columns: 1fr; } }
      .card {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
        overflow: hidden; cursor: pointer; text-align: left; padding: 0; width: 100%;
        display: flex; flex-direction: column; color: var(--ink);
      }
      .card-head { aspect-ratio: 16 / 7; position: relative; flex: none; }
      .card-noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .card-noimg span { font-family: var(--font-head); font-size: 44px; font-weight: 700; color: rgba(255,255,255,.88); }
      .card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
      .card-idrow { display: flex; gap: 10px; align-items: center; }
      .card-names { min-width: 0; }
      .card-name { font-family: var(--font-head); font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card-full { font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--ink2); }
      .catbadge { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-weight: 500; color: var(--ink); }
      .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
      .card-memo { font-size: 12.5px; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

      /* ---------- 画像フレーム（切り抜き表示） ---------- */
      .cropframe { position: relative; overflow: hidden; background: var(--surface2); }
      .cropframe > img { position: absolute; max-width: none; max-height: none; display: block; }
      .cropframe.fill { position: absolute; inset: 0; }
      .iconframe { border-radius: 50%; flex: none; border: 1px solid var(--line); }
      .iconinitial {
        border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
        font-family: var(--font-head); font-weight: 700; color: rgba(255,255,255,.92); border: 1px solid var(--line);
      }

      /* ---------- キャラクターページ ---------- */
      .backrow { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
      .char-header { aspect-ratio: 16 / 7; border-radius: var(--radius-lg); border: 1px solid var(--line); position: relative; overflow: hidden; background: var(--surface2); }
      .char-header .noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .char-header .noimg span { font-family: var(--font-head); font-size: clamp(48px, 10vw, 84px); font-weight: 700; color: rgba(255,255,255,.85); }
      .header-actions { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 6px; }
      .header-actions .btn { background: var(--surface); box-shadow: 0 1px 6px rgba(0,0,0,.25); }
      .profile { display: flex; gap: 14px; align-items: center; margin: 16px 0 6px; flex-wrap: wrap; }
      .furigana { font-size: 12.5px; color: var(--ink2); letter-spacing: .14em; }
      .char-name { font-size: clamp(24px, 5.4vw, 34px); font-weight: 700; }
      .char-full { font-size: 13.5px; color: var(--ink2); }
      .colordot { display: inline-block; width: 15px; height: 15px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); vertical-align: -2px; margin-right: 5px; }
      .memobox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 12px 14px; margin: 10px 0 18px; white-space: pre-wrap; word-break: break-word; }

      .section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); margin-bottom: 14px; overflow: hidden; }
      .section-head {
        width: 100%; display: flex; align-items: center; gap: 8px; background: transparent; border: none;
        padding: 12px 14px; min-height: 48px; color: var(--ink); text-align: left;
      }
      .section-head h2 { font-size: 17px; font-weight: 700; flex: 1; }
      .section-head .cnt { font-size: 12.5px; color: var(--ink2); }
      .section-head .chev { color: var(--ink2); font-size: 13px; }
      .section-body { padding: 2px 14px 14px; }
      .section-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
      .empty-note { color: var(--ink2); font-size: 13.5px; padding: 6px 0 2px; }

      .item { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
      .item-top { display: flex; gap: 8px; align-items: flex-start; }
      .item-title { font-weight: 700; flex: 1; min-width: 0; word-break: break-word; }
      .item-btns { display: flex; gap: 5px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
      .item-body { white-space: pre-wrap; word-break: break-word; background: var(--surface2); border-radius: var(--radius); padding: 9px 11px; margin-top: 8px; font-size: 14px; }
      .clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
      .morebtn { background: none; border: none; color: var(--accent); font-size: 13px; padding: 6px 2px; min-height: 36px; font-weight: 700; }
      .movebtns { display: flex; gap: 5px; }

      .imggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 9px; }
      .imgthumb { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); padding: 0; background: var(--surface2); cursor: pointer; width: 100%; }
      .imgthumb img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
      .imgthumb .headermark { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.62); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
      .imgthumb .cap { display: block; font-size: 11.5px; color: var(--ink2); padding: 4px 7px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--surface); }

      .relcard { display: flex; gap: 11px; align-items: flex-start; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; color: var(--ink); cursor: pointer; }
      .relcard-main { flex: 1; min-width: 0; }
      .relfeel { font-size: 13px; margin-top: 5px; white-space: pre-wrap; word-break: break-word; }
      .relfeel b { font-weight: 700; }
      .locked-note { text-align: center; padding: 14px 8px 8px; color: var(--ink2); }

      /* ---------- 表示切り替え・プロフィール帳表示 ---------- */
      .viewseg { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
      .viewseg button { flex: 1; border: none; background: transparent; color: var(--ink2); min-height: 42px; font-size: 13.5px; padding: 6px 8px; }
      .viewseg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
      .prof-top { display: grid; gap: 14px; margin-bottom: 14px; }
      .prof-top > * { min-width: 0; }
      @media (min-width: 760px) { .prof-top { grid-template-columns: 1.35fr 1fr; align-items: start; } }
      .carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: var(--radius-lg); border: 1px solid var(--line); background: var(--surface2); scrollbar-width: thin; }
      .cslide { flex: 0 0 100%; scroll-snap-align: start; position: relative; cursor: pointer; aspect-ratio: 4 / 3; }
      .cslide > img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
      .cslide .cap { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 12.5px; padding: 5px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cslide .idx { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 11.5px; padding: 2px 9px; border-radius: 999px; }
      .c-noimg { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; }
      .c-noimg span { font-family: var(--font-head); font-size: 64px; font-weight: 700; color: rgba(255,255,255,.85); }
      .prof-info { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; }
      .prof-dl { margin: 14px 0 0; display: flex; flex-direction: column; gap: 9px; }
      .prof-dl > div { display: flex; gap: 10px; align-items: flex-start; }
      .prof-dl dt { flex: none; width: 7.2em; font-size: 12.5px; color: var(--ink2); font-weight: 700; padding-top: 3px; }
      .prof-dl dd { margin: 0; flex: 1; min-width: 0; }
      .prof-sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 14px; }
      .prof-sec h2 { font-size: 16.5px; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
      .prof-sec .cnt { font-size: 12.5px; color: var(--ink2); font-family: var(--font-body); font-weight: 400; }
      .redact { background: #101012; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(140,140,140,.35); }
      .redact-line { height: 1.05em; margin: 7px 0; }
      .prof-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 14px; }
      .prof-card .prof-top { margin-bottom: 0; }
      .prof-colhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-family: var(--font-head); font-weight: 700; font-size: 15px; margin-bottom: 8px; }
      .prof-colhint { font-family: var(--font-body); font-size: 12px; font-weight: 400; color: var(--ink2); }
      .prof-info.flat { border: none; background: transparent; padding: 0; }
      .prof-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 16px; }
      .proftile {
        border: 1px solid var(--line); background: var(--surface2); border-radius: var(--radius);
        padding: 12px 6px 10px; min-height: 66px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 3px; color: var(--ink); cursor: pointer;
      }
      .proftile .pt-label { font-size: 13px; font-weight: 700; text-align: center; }
      .proftile .pt-count { font-size: 15.5px; }
      .overlay.blur { backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }

      /* ---------- モーダル ---------- */
      .overlay {
        position: fixed; inset: 0; background: rgba(10,10,12,.55); z-index: 60;
        display: none; align-items: flex-end; justify-content: center; padding: 0;
      }
      .overlay.open { display: flex; }
      @media (min-width: 700px) { .overlay { align-items: center; padding: 20px; } }
      .sheet {
        background: var(--surface); color: var(--ink); width: 100%; max-width: 680px;
        max-height: 92dvh; overflow-y: auto; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        padding: 18px clamp(14px, 4vw, 26px) 26px;
      }
      @media (min-width: 700px) { .sheet { border-radius: var(--radius-lg); } }
      .sheet h2 { font-size: 19px; margin-bottom: 12px; }
      .sheet h3 { font-size: 15px; margin: 18px 0 8px; }
      .field { margin-bottom: 13px; }
      .field label, .field .flabel { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
      .field .hint { font-size: 12px; color: var(--ink2); font-weight: 400; margin-top: 3px; }
      .field input[type="text"], .field input[type="url"], .field select, .field textarea {
        width: 100%; border: 1px solid var(--line); border-radius: var(--radius);
        background: var(--surface); padding: 9px 11px; min-height: 42px;
      }
      .field textarea { min-height: 84px; resize: vertical; line-height: 1.6; }
      .fieldrow { display: flex; gap: 9px; }
      .fieldrow > * { flex: 1; min-width: 0; }
      .segrow { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
      .segrow button { flex: 1; border: none; background: var(--surface); color: var(--ink2); min-height: 42px; font-size: 12.5px; padding: 4px 1px; line-height: 1.35; }
      .segrow button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
      .form-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
      .form-actions .spacer { flex: 1; }
      .namepreview { background: var(--surface2); border-radius: var(--radius); padding: 9px 12px; font-size: 13.5px; }
      .colorrow { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
      input[type="color"] { width: 56px; height: 42px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 3px; cursor: pointer; }
      .hexinput { width: 118px !important; flex: none; text-transform: lowercase; }
      .presetrow { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
      .preset { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
      .preset.on { border-color: var(--ink); transform: scale(1.08); }
      .presetname { font-size: 11.5px; color: var(--ink2); text-align: center; }
      .presetwrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .tagedit { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .tagedit .tagchip button { border: none; background: none; color: inherit; min-height: 28px; padding: 0 2px 0 5px; font-size: 14px; cursor: pointer; }
      .designcard {
        display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px;
        border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
        color: var(--ink); margin-bottom: 9px; cursor: pointer; min-height: 56px;
      }
      .designcard.on { border-color: var(--accent); border-width: 2px; }
      .designswatch { width: 40px; height: 40px; border-radius: 50%; flex: none; border: 1px solid var(--line); }
      .catrow { display: flex; gap: 7px; align-items: center; margin-bottom: 9px; }
      .catrow input { flex: 1; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; min-height: 40px; background: var(--surface); min-width: 0; }
      .helpbody p { margin: 0 0 9px; font-size: 14px; }
      .helpbody h3 { font-family: var(--font-head); }

      /* ---------- 画像ビューア・切り抜き編集 ---------- */
      .viewerbox { text-align: center; }
      .viewerbox img.big { max-width: 100%; max-height: 62dvh; border-radius: var(--radius); background: #000; }
      .viewer-cap { margin: 10px 0; white-space: pre-wrap; word-break: break-word; }
      .viewer-btns { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
      .cropstage { position: relative; overflow: hidden; background: #111; border-radius: var(--radius); margin: 0 auto; touch-action: none; max-width: 100%; }
      .cropstage img { position: absolute; max-width: none; max-height: none; display: block; cursor: grab; }
      input[type="range"] { width: 100%; min-height: 40px; accent-color: var(--accent); }

      #toast {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
        background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
        font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 99;
        max-width: 92vw; text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,.3);
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* ---------- 読み込み中画面 ---------- */
      #loader {
        position: fixed; inset: 0; z-index: 200; background: var(--bg);
        display: flex; align-items: center; justify-content: center;
        transition: opacity .5s ease, visibility .5s ease;
      }
      #loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
      .loader-inner { text-align: center; padding: 24px 20px; }
      .loader-hero { display: inline-block; animation: loader-hero-hop .78s ease-in-out infinite; }
      .loader-hero img {
        width: 148px; height: auto; display: block;
        filter: drop-shadow(0 12px 14px rgba(30, 20, 40, .22));
      }
      .loader-hearts { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
      .loader-hearts svg { animation: loader-hop 1.05s ease-in-out infinite; }
      .loader-hearts svg:nth-child(2) { animation-delay: .16s; }
      .loader-hearts svg:nth-child(3) { animation-delay: .32s; }
      .loader-title {
        font-family: "M PLUS Rounded 1c", var(--font-body); font-weight: 700;
        font-size: 19px; color: var(--ink); margin: 14px 0 2px; letter-spacing: .06em;
      }
      .loader-title .ldot { display: inline-block; animation: loader-dot 1.2s ease-in-out infinite; }
      .loader-title .ldot:nth-child(2) { animation-delay: .18s; }
      .loader-title .ldot:nth-child(3) { animation-delay: .36s; }
      .loader-sub { font-size: 12.5px; color: var(--ink2); margin: 2px 0 0; line-height: 1.55; }
      .loader-bar {
        width: 200px; max-width: 64vw; height: 11px; margin: 16px auto 0; border-radius: 999px;
        background: var(--surface2); border: 1px solid var(--line); overflow: hidden;
      }
      .loader-bar i {
        display: block; height: 100%; width: 0%; border-radius: 999px;
        background: linear-gradient(90deg, #ef9dbd, #b79ce0, #8fc3e8);
      }
      .loader-pct {
        font-size: 11.5px; color: var(--ink2); margin: 6px 0 0; letter-spacing: .1em;
        font-variant-numeric: tabular-nums;
      }
      /* うちの子パレード（登録があるときだけ表示） */
      .loader-chars { display: none; }
      #loader.has-chars .loader-chars {
        display: flex; gap: 12px 10px; justify-content: center; flex-wrap: wrap;
        max-width: 372px; margin: 16px auto 0;
      }
      #loader.has-chars .loader-hero img { width: 108px; }
      .loader-char {
        display: flex; flex-direction: column; align-items: center; gap: 5px;
        width: 68px; animation: loader-char-bounce .95s ease-in-out infinite;
      }
      /* ページを開くときの読み込み画面は、一回のロードでひとりだけが主役で出ます */
      #loader.one-char .loader-hero { display: none; }
      .loader-char.solo { width: auto; animation-name: loader-hero-hop; animation-duration: .78s; }
      .loader-char.solo .loader-char-icon { width: 118px; height: 118px; border-width: 4px; }
      .loader-char.solo .loader-char-initial { font-size: 52px; }
      .loader-char.solo .loader-char-miniimg { height: 158px; max-width: 196px; }
      .loader-char.solo .loader-char-name { font-size: 13.5px; max-width: 196px; padding: 2px 12px 3px; }
      .loader-char-icon {
        width: 60px; height: 60px; border-radius: 50%; overflow: hidden; flex: none;
        background: var(--surface2); border: 3px solid var(--surface);
        box-shadow: 0 4px 14px rgba(0,0,0,.18), 0 0 0 1px var(--line);
        display: flex; align-items: center; justify-content: center;
      }
      .loader-char-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .loader-char-initial {
        width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        font-family: var(--font-head); font-weight: 700; color: rgba(255,255,255,.95); font-size: 26px;
      }
      .loader-char-name {
        font-size: 11.5px; font-weight: 700; color: var(--ink); line-height: 1.45;
        background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
        padding: 1px 8px 2px; max-width: 68px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .loader-char.more .loader-char-icon { background: var(--chip); }
      .loader-char.more .loader-char-initial { color: var(--ink); font-family: var(--font-body); font-size: 16px; }
      /* ミニキャラ画像がある子は、丸アイコンではなく全身で出ます */
      .loader-char.mini { width: auto; min-width: 68px; }
      .loader-char-miniimg {
        height: 84px; width: auto; max-width: 108px; object-fit: contain; display: block;
        filter: drop-shadow(0 7px 9px rgba(30, 20, 40, .25));
      }
      /* キャラクターページを開くときの読み込み画面 */
      #charloader {
        position: fixed; inset: 0; z-index: 150; background: var(--bg);
        display: flex; align-items: center; justify-content: center;
        transition: opacity .45s ease, visibility .45s ease;
      }
      #charloader[hidden] { display: none; }
      #charloader.done { opacity: 0; visibility: hidden; pointer-events: none; }
      .loader-hero img.charloader-miniimg {
        width: auto; height: auto; max-width: min(230px, 62vw); max-height: 300px; display: block;
        filter: drop-shadow(0 14px 16px rgba(30, 20, 40, .22));
      }
      .charloader-iconframe { width: 124px; height: 124px; border-radius: 50%; border: 4px solid var(--line); display: inline-block; vertical-align: middle; }
      @keyframes loader-char-bounce { 0%, 100% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(2px) scale(1.05, .93); } 55% { transform: translateY(-16px) scale(.98, 1.04); } 78% { transform: translateY(0) scale(1.03, .96); } }
      @keyframes loader-hero-hop {
        0%, 100% { transform: translateY(0) rotate(-1.6deg) scale(1, 1); }
        16% { transform: translateY(3px) rotate(0deg) scale(1.07, .92); }
        46% { transform: translateY(-30px) rotate(2deg) scale(.97, 1.05); }
        68% { transform: translateY(0) rotate(0deg) scale(1.05, .94); }
        84% { transform: translateY(-11px) rotate(-.8deg) scale(1, 1); }
      }
      @keyframes loader-hop { 0%, 100% { transform: translateY(0) scale(1); } 45% { transform: translateY(-11px) scale(1.16); } }
      @keyframes loader-dot { 0%, 100% { opacity: .2; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) {
        #loader, #loader *, #charloader, #charloader * { animation: none !important; }
        .loader-bar i { opacity: .55; }
      }
      body.preview .edit-only { display: none !important; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>

    <script>
    'use strict';
    /* ================= データ管理 ================= */
    var LS_KEY = 'uchinoko-htmlban-v1';

      { n: 'すみれ', c: '#7b6bb5' }, { n: 'ばら', c: '#c2546e' }, { n: 'こはく', c: '#d29a3c' },

    var DESIGNS = [

    function markGlyph(m) { return typeof m === 'string' ? m : (m && m.g ? String(m.g) : ''); }

          var seg = new Intl.Segmenter('ja', { granularity: 'grapheme' });
          return Array.from(seg.segment(t), function (x) { return x.segment; }).filter(function (x) { return x.trim(); });

        '" data-x="' + crop.x + '" data-y="' + crop.y + '" data-zoom="' + crop.zoom + '"></div>';
    }
    function iconHTML(c, size) {
      if (c.icon && c.icon.src) {
        return '<div class="cropframe iconframe" style="width:' + size + 'px;height:' + size + 'px">' +
          '<img alt="" src="' + c.icon.src + '" data-nw="' + (c.icon.w || 1) + '" data-nh="' + (c.icon.h || 1) +

      }

    }
    function layoutCrops() {
      document.querySelectorAll('.cropframe').forEach(function (f) {
        var img = f.querySelector('img'); if (!img) return;
        var W = f.clientWidth, H = f.clientHeight; if (!W || !H) return;
        var nw = +img.getAttribute('data-nw') || 1, nh = +img.getAttribute('data-nh') || 1;
        var s = Math.max(W / nw, H / nh) * (+img.getAttribute('data-zoom') || 1);
        var w = nw * s, h = nh * s;
        img.style.width = w + 'px'; img.style.height = h + 'px';
        img.style.left = ((+img.getAttribute('data-x') || .5) * (W - w)) + 'px';
        img.style.top = ((+img.getAttribute('data-y') || .5) * (H - h)) + 'px';
      });
    }
    window.addEventListener('resize', layoutCrops);

    <script>

    function closeSheet() { overlayEl.classList.remove('open'); overlayEl.classList.remove('blur'); sheetEl.innerHTML = ''; cropEd = null; form = null; }
    overlayEl.addEventListener('click', function (e) { if (e.target === overlayEl) closeSheet(); });

        '<button type="button" class="btn btn-ghost btn-small" onclick="closeSheet()" aria-label="閉じる">✕</button></div>';
    }
    var confirmCb = null;
    function askConfirm(title, msg, okLabel, cb, danger) {
      confirmCb = cb;

        '<div class="form-actions"><button type="button" class="btn" onclick="closeSheet()">やめておく</button><span class="spacer"></span>' +
        '<button type="button" class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" onclick="doConfirm()">' + esc(okLabel) + '</button></div>');
    }
    function doConfirm() { var cb = confirmCb; confirmCb = null; closeSheet(); if (cb) cb(); }

    /* ================= 画面遷移 ================= */
    function render() {
      document.documentElement.setAttribute('data-design', state.design || 'chic');
      document.body.classList.toggle('preview', ui.preview);
      if (ui.view === 'char' && findChar(ui.charId)) renderCharPage();
      else { ui.view = 'list'; renderList(); }
      layoutCrops();
    }
    function goChar(id) {
      ui.view = 'char'; ui.charId = id; ui.reorderKey = null; ui.sectionReorder = false;
      window.scrollTo(0, 0);
      var c = findChar(id);
      if (c) showCharLoader(c);
      render();
    }
    function backList() { hideCharLoader(true); ui.view = 'list'; ui.charId = null; ui.sectionReorder = false; render(); }
    /* キャラクターページを開くとき、その子のミニキャラ画像（なければアイコン・頭文字）で読み込み画面を出します */
    var charLoaderTimers = [];
    function clearCharLoaderTimers() { charLoaderTimers.forEach(function (t) { clearTimeout(t); }); charLoaderTimers = []; }
    /* 読み込みの進み具合バー：表示されている時間に合わせて0%から100%まで進めます */
    var loaderProgAnims = {};
    function setLoaderProgress(prefix, p) {
      var fill = document.getElementById(prefix + '-fill');
      var pct = document.getElementById(prefix + '-pct');
      var bar = document.getElementById(prefix + '-bar');
      p = Math.max(0, Math.min(100, Math.round(p)));
      if (fill) fill.style.width = p + '%';
      if (pct) pct.textContent = p + '%';
      if (bar) bar.setAttribute('aria-valuenow', String(p));
    }
    function stopLoaderProgress(prefix) {
      if (loaderProgAnims[prefix]) { cancelAnimationFrame(loaderProgAnims[prefix]); delete loaderProgAnims[prefix]; }
    }
    function startLoaderProgress(prefix, duration) {
      stopLoaderProgress(prefix);
      setLoaderProgress(prefix, 0);
      var startTs = null;
      function step(ts) {
        if (startTs == null) startTs = ts;
        var t = duration > 0 ? Math.min(1, (ts - startTs) / duration) : 1;
        setLoaderProgress(prefix, (1 - Math.pow(1 - t, 1.6)) * 100);
        if (t < 1) loaderProgAnims[prefix] = requestAnimationFrame(step);
        else delete loaderProgAnims[prefix];
      }
      loaderProgAnims[prefix] = requestAnimationFrame(step);
    }
    function finishLoaderProgress(prefix) { stopLoaderProgress(prefix); setLoaderProgress(prefix, 100); }
    function showCharLoader(c) {
      var el = document.getElementById('charloader'); if (!el) return;
      clearCharLoaderTimers();
      var hero = document.getElementById('charloader-hero');
      var sub = document.getElementById('charloader-sub');
      var hasMini = !!(c.mini && c.mini.src);
      if (hero) {
        if (hasMini) {
          hero.innerHTML = '<img class="charloader-miniimg" src="' + c.mini.src + '" alt="">';
        } else if (c.icon && c.icon.src) {
          hero.innerHTML = cropImgHTML(c.icon, c.icon, 'charloader-iconframe');
          var fr = hero.querySelector('.cropframe');
          if (fr) fr.style.borderColor = c.color || 'var(--line)';
        } else {
          hero.innerHTML = '<span class="iconinitial" style="width:124px;height:124px;background:' + esc(c.color || '#888') + ';font-size:58px">' + esc(initialOf(c)) + '</span>';
        }

      var customMsg = (c.loadMsg || '').trim();
      if (sub) sub.textContent = customMsg || (hasMini ? (headName(c) + ' が かけつけたよ') : (headName(c) + ' のページを読み込んでいます'));

      charLoaderTimers.push(setTimeout(function () { hideCharLoader(false); }, 1000));
      charLoaderTimers.push(setTimeout(function () { hideCharLoader(true); }, 3200));
    }
    function hideCharLoader(now) {
      var el = document.getElementById('charloader'); if (!el || el.hidden) return;
      if (now) {

        stopLoaderProgress('charloader');
        el.hidden = true; el.classList.remove('done');

    }
    function setCatFilter(id) { ui.catFilter = id; render(); }

        '<button type="button" class="btn edit-only" onclick="openDataMenu()">データ</button>' +

      h += '<div class="chiprow" role="group" aria-label="区分で絞り込み">' +
        '<button type="button" class="chip' + (ui.catFilter === 'all' ? ' on' : '') + '" onclick="setCatFilter(\'all\')">すべて<span class="cnt">' + state.characters.length + '</span></button>';

    function processImageFile(file, cb) {

          var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;

        };
        img.onerror = function () { toast('画像を読み込めませんでした'); };
        img.src = reader.result;
      };

    }

    var cropEd = null;
    function openCrop(src, w, h, aspect, init, onDone) {
      cropEd = { src: src, w: w || 1, h: h || 1, x: init ? init.x : .5, y: init ? init.y : .5, zoom: init ? init.zoom : 1, onDone: onDone };
      var circle = aspect === '1 / 1';
      var cropTitle = aspect === '16 / 7' ? 'ヘッダーの位置を調整' : (circle ? 'アイコンの位置を調整' : 'プロフィール帳表示の位置を調整');
      openSheet(sheetHead(cropTitle) +
        '<p style="font-size:13.5px;color:var(--ink2);margin:0 0 10px">画像をドラッグして位置を動かし、スライダーで大きさを調整してください。枠の中が実際に表示される範囲です。</p>' +
        '<div class="cropstage" id="cropstage" style="aspect-ratio:' + aspect + ';' + (circle ? 'width:min(320px,100%);border-radius:50%' : 'width:100%') + '">' +
        '<img id="cropimg" src="' + src + '" alt=""></div>' +
        '<div class="field" style="margin-top:12px"><label for="cropzoom">大きさ</label>' +
        '<input type="range" id="cropzoom" min="1" max="3" step="0.01" value="' + cropEd.zoom + '"></div>' +
        '<div class="form-actions"><button type="button" class="btn" onclick="closeSheet()">やめておく</button><span class="spacer"></span>' +
        '<button type="button" class="btn btn-primary" onclick="doneCrop()">この位置にする</button></div>');
      var stage = document.getElementById('cropstage');
      var img = document.getElementById('cropimg');
      layoutCropStage();
      document.getElementById('cropzoom').addEventListener('input', function (e) {

      var drag = null;
      stage.addEventListener('pointerdown', function (e) {
        drag = { px: e.clientX, py: e.clientY, x: cropEd.x, y: cropEd.y };
        stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener('pointermove', function (e) {
        if (!drag) return;
        var W = stage.clientWidth, H = stage.clientHeight;
        var s = Math.max(W / cropEd.w, H / cropEd.h) * cropEd.zoom;
        var iw = cropEd.w * s, ih = cropEd.h * s;
        if (W - iw !== 0) cropEd.x = Math.min(1, Math.max(0, drag.x + (e.clientX - drag.px) / (W - iw)));
        if (H - ih !== 0) cropEd.y = Math.min(1, Math.max(0, drag.y + (e.clientY - drag.py) / (H - ih)));

      ['pointerup', 'pointercancel'].forEach(function (ev) { stage.addEventListener(ev, function () { drag = null; }); });
    }
    function layoutCropStage() {
      if (!cropEd) return;

      var W = stage.clientWidth, H = stage.clientHeight; if (!W || !H) return;
      var s = Math.max(W / cropEd.w, H / cropEd.h) * cropEd.zoom;
      var w = cropEd.w * s, h = cropEd.h * s;
      img.style.width = w + 'px'; img.style.height = h + 'px';
      img.style.left = (cropEd.x * (W - w)) + 'px'; img.style.top = (cropEd.y * (H - h)) + 'px';
    }

      cropEd = null;
      if (cb) cb(res); else closeSheet();
    }

    <script>
    /* ================= プロンプト / リンク / 秘匿情報フォーム ================= */
    function openPromptForm(pid) {
      var c = findChar(ui.charId); if (!c) return;
      var p = pid ? (c.prompts || []).find(function (x) { return x.id === pid; }) : null;
      openSheet(sheetHead(p ? 'プロンプトを編集' : 'プロンプトを追加') +
        '<div class="field"><label for="pf-title">タイトル</label><input type="text" id="pf-title" value="' + esc(p ? p.title : '') + '" placeholder="例：基本の見た目"></div>' +
        '<div class="field"><label for="pf-body">本文</label><textarea id="pf-body" style="min-height:150px" placeholder="コピーして使いたい文章をそのまま貼り付けられます">' + esc(p ? p.body : '') + '</textarea></div>' +
        '<div class="form-actions"><button type="button" class="btn" onclick="closeSheet()">やめておく</button><span class="spacer"></span>' +
        '<button type="button" class="btn btn-primary" onclick="savePromptForm(\'' + (pid || '') + '\')">保存する</button></div>');
      document.getElementById('pf-title').focus();
    }
    function savePromptForm(pid) {
      var c = findChar(ui.charId); if (!c) return;
      var title = document.getElementById('pf-title').value.trim();
      var body = document.getElementById('pf-body').value;
      if (!body.trim()) { toast('本文を入力してください'); return; }
      c.prompts = c.prompts || [];
      if (pid) { var p = c.prompts.find(function (x) { return x.id === pid; }); if (p) { p.title = title; p.body = body; } }
      else c.prompts.push({ id: uid(), title: title, body: body });
      save(); closeSheet(); render(); toast('プロンプトを保存しました');
    }
    function deletePrompt(pid) {
      var c = findChar(ui.charId); if (!c) return;
      askConfirm('プロンプトを削除しますか？', 'このプロンプトを削除します。元に戻せません。', '削除する', function () {
        c.prompts = (c.prompts || []).filter(function (x) { return x.id !== pid; });
        save(); render(); toast('プロンプトを削除しました');
      }, true);
    }
    function openLinkForm(lid) {
      var c = findChar(ui.charId); if (!c) return;
      var l = lid ? (c.links || []).find(function (x) { return x.id === lid; }) : null;
      openSheet(sheetHead(l ? 'リンクを編集' : 'リンクを追加') +
        '<div class="field"><label for="lf-label">表示名</label><input type="text" id="lf-label" value="' + esc(l ? l.label : '') + '" placeholder="例：設定資料のページ"></div>' +
        '<div class="field"><label for="lf-url">URL</label><input type="url" id="lf-url" value="' + esc(l ? l.url : '') + '" placeholder="https://…"></div>' +
        '<div class="form-actions"><button type="button" class="btn" onclick="closeSheet()">やめておく</button><span class="spacer"></span>' +
        '<button type="button" class="btn btn-primary" onclick="saveLinkForm(\'' + (lid || '') + '\')">保存する</button></div>');
    }
    function saveLinkForm(lid) {
      var c = findChar(ui.charId); if (!c) return;
      var label = document.getElementById('lf-label').value.trim();
      var url = document.getElementById('lf-url').value.trim();
      if (!url) { toast('URLを入力してください'); return; }
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      c.links = c.links || [];
      if (lid) { var l = c.links.find(function (x) { return x.id === lid; }); if (l) { l.label = label; l.url = url; } }
      else c.links.push({ id: uid(), label: label, url: url });
      save(); closeSheet(); render(); toast('リンクを保存しました');
    }
    function deleteLink(lid) {
      var c = findChar(ui.charId); if (!c) return;
      askConfirm('リンクを削除しますか？', 'このリンクを削除します。元に戻せません。', '削除する', function () {
        c.links = (c.links || []).filter(function (x) { return x.id !== lid; });
        save(); render(); toast('リンクを削除しました');
      }, true);
    }
    function openSecretForm(sid) {
      var c = findChar(ui.charId); if (!c) return;
      var s = sid ? (c.secrets || []).find(function (x) { return x.id === sid; }) : null;
      openSheet(sheetHead(s ? '秘匿情報を編集' : '秘匿情報を追加') +
        '<div class="field"><label for="sf-label">ラベル</label><input type="text" id="sf-label" value="' + esc(s ? s.label : '') + '" placeholder="例：本当の正体"></div>' +
        '<div class="field"><label for="sf-body">内容</label><textarea id="sf-body" style="min-height:130px">' + esc(s ? s.body : '') + '</textarea></div>' +
        '<div class="form-actions"><button type="button" class="btn" onclick="closeSheet()">やめておく</button><span class="spacer"></span>' +
        '<button type="button" class="btn btn-primary" onclick="saveSecretForm(\'' + (sid || '') + '\')">保存する</button></div>');
    }
    function saveSecretForm(sid) {
      var c = findChar(ui.charId); if (!c) return;
      var label = document.getElementById('sf-label').value.trim();
      var body = document.getElementById('sf-body').value;
      if (!body.trim() && !label) { toast('内容を入力してください'); return; }
      c.secrets = c.secrets || [];
      if (sid) { var s = c.secrets.find(function (x) { return x.id === sid; }); if (s) { s.label = label; s.body = body; } }
      else c.secrets.push({ id: uid(), label: label, body: body });
      save(); closeSheet(); render(); toast('秘匿情報を保存しました');
    }
    function deleteSecret(sid) {
      var c = findChar(ui.charId); if (!c) return;
      askConfirm('秘匿情報を削除しますか？', 'この秘匿情報を削除します。元に戻せません。', '削除する', function () {
        c.secrets = (c.secrets || []).filter(function (x) { return x.id !== sid; });
        save(); render(); toast('秘匿情報を削除しました');
      }, true);
    }

    /* ================= 関係性フォーム ================= */
    function openRelForm(rid) {
      var c = findChar(ui.charId); if (!c) return;
      var r = rid ? (c.relationships || []).find(function (x) { return x.rid === rid; }) : null;
      var others = state.characters.filter(function (o) {
        if (o.id === c.id) return false;
        if (!r && (c.relationships || []).some(function (x) { return x.otherId === o.id; })) return false;
        return true;
      });
      if (!r && !others.length) { toast('関係性を付けられる相手がまだいません'); return; }
      var otherName = r ? (findChar(r.otherId) ? headName(findChar(r.otherId)) : '相手') : '';
      var h = sheetHead(r ? '関係性を編集' : '関係性を追加');
      if (r) {
        h += '<div class="field"><span class="flabel">相手</span><div class="namepreview">' + esc(otherName) + '</div></div>';
      } else {
        h += '<div class="field"><label for="rf-other">相手のキャラクター</label><select id="rf-other">' +
          others.map(function (o) { return '<option value="' + o.id + '">' + esc(headName(o)) + '</option>'; }).join('') + '</select></div>';
      }
      h += '<div class="field"><label for="rf-label">関係性の名前</label><input type="text" id="rf-label" value="' + esc(r ? r.label : '') + '" placeholder="例：幼なじみ、ライバル、主従など"></div>' +
        '<div class="field"><label for="rf-memo">関係性のメモ</label><textarea id="rf-memo" placeholder="出会いやエピソードなど">' + esc(r ? r.memo : '') + '</textarea></div>' +
        '<div class="field"><label for="rf-to">' + esc(headName(c)) + ' → 相手 への気持ち</label><textarea id="rf-to" placeholder="' + esc(headName(c)) + 'から見た気持ち">' + esc(r ? r.feelingsTo : '') + '</textarea></div>' +
        '<div class="field"><label for="rf-from">相手 → ' + esc(headName(c)) + ' への気持ち</label><textarea id="rf-from" placeholder="相手から見た気持ち">' + esc(r ? r.feelingsFrom : '') + '</textarea></div>' +
        '<p class="hint">相手のキャラクターのページにも、同じ関係性が自動で表示されます。</p>' +
        '<div class="form-actions"><button type="button" class="btn" onclick="closeSheet()">やめておく</button><span class="spacer"></span>' +
        '<button type="button" class="btn btn-primary" onclick="saveRelForm(\'' + (rid || '') + '\')">保存する</button></div>';
      openSheet(h);
    }
    function saveRelForm(rid) {
      var c = findChar(ui.charId); if (!c) return;
      var label = document.getElementById('rf-label').value.trim();
      var memo = document.getElementById('rf-memo').value;
      var to = document.getElementById('rf-to').value;
      var from = document.getElementById('rf-from').value;
      c.relationships = c.relationships || [];
      if (rid) {
        var r = c.relationships.find(function (x) { return x.rid === rid; }); if (!r) { closeSheet(); return; }
        r.label = label; r.memo = memo; r.feelingsTo = to; r.feelingsFrom = from;
        var o = findChar(r.otherId);
        if (o) {
          o.updatedAt = Date.now();
          var m = (o.relationships || []).find(function (x) { return x.rid === rid; });
          if (m) { m.label = label; m.memo = memo; m.feelingsTo = from; m.feelingsFrom = to; }
        }
      } else {
        var otherId = document.getElementById('rf-other').value;
        var o2 = findChar(otherId); if (!o2) { closeSheet(); return; }
        var newRid = uid();
        c.relationships.push({ rid: newRid, otherId: otherId, label: label, memo: memo, feelingsTo: to, feelingsFrom: from });
        o2.relationships = o2.relationships || [];
        o2.relationships.push({ rid: newRid, otherId: c.id, label: label, memo: memo, feelingsTo: from, feelingsFrom: to });
        o2.updatedAt = Date.now();
      }
      save(); closeSheet(); render(); toast('関係性を保存しました');
    }
    function deleteRel(rid) {
      var c = findChar(ui.charId); if (!c) return;
      var r = (c.relationships || []).find(function (x) { return x.rid === rid; });
      var o = r ? findChar(r.otherId) : null;
      askConfirm('関係性を削除しますか？', '相手のページからも、この関係性が消えます。元に戻せません。', '削除する', function () {
        c.relationships = (c.relationships || []).filter(function (x) { return x.rid !== rid; });
        if (o) { o.relationships = (o.relationships || []).filter(function (x) { return x.rid !== rid; }); o.updatedAt = Date.now(); }
        save(); render(); toast('関係性を削除しました');
      }, true);
    }

    /* ================= 区分の管理 ================= */
    function openCatManager() {
      var h = sheetHead('区分を管理');
      h += '<h3>区分の一覧</h3>';
      state.categories.forEach(function (cat) {
        var n = state.characters.filter(function (c) { return c.categoryId === cat.id; }).length;
        h += '<div class="catrow"><input type="text" id="cat-' + cat.id + '" value="' + esc(cat.name) + '" aria-label="区分名">' +
          '<span style="font-size:12px;color:var(--ink2);white-space:nowrap">' + n + '人</span>' +
          '<button type="button" class="btn btn-small" onclick="renameCat(\'' + cat.id + '\')">名前を変更</button>' +
          '<button type="button" class="btn btn-small btn-danger" onclick="deleteCat(\'' + cat.id + '\')">削除</button></div>';
      });
      h += '<h3>区分を追加</h3><div class="catrow"><input type="text" id="cat-new" placeholder="新しい区分の名前">' +
        '<button type="button" class="btn btn-primary btn-small" onclick="addCat()">追加</button></div>';
      if (state.categories.length > 1 && state.characters.length) {
        h += '<h3>キャラクターをまとめて移動</h3>' +
          '<div class="fieldrow"><div class="field"><label for="mv-from">移動元の区分</label><select id="mv-from">' +
          state.categories.map(function (cat) { return '<option value="' + cat.id + '">' + esc(cat.name) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label for="mv-to">移動先の区分</label><select id="mv-to">' +
          state.categories.map(function (cat) { return '<option value="' + cat.id + '">' + esc(cat.name) + '</option>'; }).join('') + '</select></div></div>' +
          '<button type="button" class="btn" onclick="bulkMove()">まとめて移動する</button>';
      }
      h += '<div class="form-actions"><button type="button" class="btn" onclick="closeSheet()">閉じる</button></div>';
      openSheet(h);
    }
    function renameCat(id) {
      var input = document.getElementById('cat-' + id);
      var v = input.value.trim(); if (!v) { toast('区分の名前を入力してください'); return; }
      var cat = state.categories.find(function (x) { return x.id === id; }); if (!cat) return;
      cat.name = v; save(); openCatManager(); render(); toast('区分の名前を変更しました');
    }
    function addCat() {
      var input = document.getElementById('cat-new');
      var v = input.value.trim(); if (!v) { toast('区分の名前を入力してください'); return; }
      state.categories.push({ id: uid(), name: v });
      save(); openCatManager(); render(); toast('区分を追加しました');
    }
    function deleteCat(id) {
      var cat = state.categories.find(function (x) { return x.id === id; }); if (!cat) return;
      var n = state.characters.filter(function (c) { return c.categoryId === id; }).length;
      askConfirm('区分を削除しますか？', '区分「' + cat.name + '」を削除します。' + (n ? '\nこの区分のキャラクター' + n + '人は「未分類」になります。' : ''), '削除する', function () {
        state.categories = state.categories.filter(function (x) { return x.id !== id; });
        state.characters.forEach(function (c) { if (c.categoryId === id) c.categoryId = null; });
        if (ui.catFilter === id) ui.catFilter = 'all';
        save(); openCatManager(); render(); toast('区分を削除しました');
      }, true);
    }
    function bulkMove() {
      var from = document.getElementById('mv-from').value, to = document.getElementById('mv-to').value;
      if (from === to) { toast('移動元と移動先が同じです'); return; }
      var n = 0;
      state.characters.forEach(function (c) { if (c.categoryId === from) { c.categoryId = to; n++; } });
      save(); openCatManager(); render(); toast(n + '人を移動しました');
    }

    /* ================= デザイン選択 ================= */
    function openDesignPicker() {
      var h = sheetHead('🎨 デザインを選ぶ') + '<p style="font-size:13.5px;color:var(--ink2);margin:0 0 12px">まわりの枠の雰囲気が変わります。写真・アイコン・イメージカラーは、どのデザインでも元の色のまま表示されます。</p>';
      DESIGNS.forEach(function (d) {
        h += '<button type="button" class="designcard' + (state.design === d.id ? ' on' : '') + '" onclick="pickDesign(\'' + d.id + '\')">' +
          '<span class="designswatch" style="background:' + d.sw + '"></span>' +
          '<span><b>' + esc(d.name) + '</b><br><span style="font-size:13px;color:var(--ink2)">' + esc(d.desc) + '</span></span></button>';
      });
      h += '<div class="form-actions"><button type="button" class="btn" onclick="closeSheet()">閉じる</button></div>';
      openSheet(h);
      sheetEl.scrollIntoView({ block: 'nearest' });
    }
    function pickDesign(id) {
      state.design = id; save(); closeSheet(); render();
      var d = DESIGNS.find(function (x) { return x.id === id; });
      toast('デザインを「' + (d ? d.name : id) + '」にしました');
    }

    /* ================= データ管理 ================= */
    function openDataMenu() {
      var size = 0;
      try { size = (localStorage.getItem(LS_KEY) || '').length; } catch (e) {}
      var h = sheetHead('データ') +
        '<p style="font-size:14px">このページのデータは、このブラウザの中に保存されています。閉じても残りますが、ブラウザのデータを消すと一緒に消えてしまいます。大事なデータは、ときどき書き出して控えを取っておくのがおすすめです。</p>' +
        '<p style="font-size:13px;color:var(--ink2)">現在のデータ量の目安：約 ' + Math.max(1, Math.round(size / 1024)) + ' KB</p>' +
        '<h3>控えを取る・戻す</h3>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button type="button" class="btn" onclick="exportData()">データを書き出す（JSON）</button>' +
        '<button type="button" class="btn" onclick="document.getElementById(\'file-import\').click()">書き出したデータを読み込む</button></div>' +
        '<p class="hint" style="font-size:12px;color:var(--ink2)">読み込むと、今のデータは読み込んだ内容に置き換わります。</p>' +
        '<h3>このページ自体を保存</h3>' +
        '<p style="font-size:14px">このページをHTMLファイルとして保存できます。保存したファイルは、ブラウザで開くだけで同じように使えます（データは開いた人のブラウザに保存されます）。</p>' +
        '<button type="button" class="btn" onclick="downloadSelf()">HTMLファイルとして保存する</button>' +
        '<h3>すべて消す</h3>' +
        '<button type="button" class="btn btn-danger" onclick="askWipe()">すべてのデータを削除</button>' +
        '<div class="form-actions"><button type="button" class="btn" onclick="closeSheet()">閉じる</button></div>';
      openSheet(h);
    }
    function downloadBlob(blob, filename) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 400);
    }
    function exportData() {
      downloadBlob(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }), 'uchinoko-matome-data.json');
      toast('データを書き出しました');
    }
    document.getElementById('file-import').addEventListener('change', function (e) {
      var f = (e.target.files || [])[0]; e.target.value = '';
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var s = JSON.parse(reader.result);
          if (!s || !Array.isArray(s.characters) || !Array.isArray(s.categories)) throw new Error('bad');
          askConfirm('データを読み込みますか？', '今のデータは、読み込んだ内容に置き換わります。よろしいですか？', '読み込む', function () {
            state = s; save(); ui.view = 'list'; ui.charId = null; ui.tagFilter = null; ui.catFilter = 'all';
            render(); toast('データを読み込みました');
          });
        } catch (err) { toast('そのファイルは読み込めませんでした'); }
      };
      reader.readAsText(f);
    });
    function downloadSelf() {
      var html = '<!doctype html>\n' + document.documentElement.outerHTML;
      downloadBlob(new Blob([html], { type: 'text/html' }), 'uchinoko-matome.html');
      toast('HTMLファイルを保存しました');
    }
    function askWipe() {
      askConfirm('すべてのデータを削除しますか？', 'キャラクター・区分・設定のすべてが消えます。元に戻せません。', 'すべて削除する', function () {
        state = defaultState(); save();
        ui.view = 'list'; ui.charId = null; ui.unlocked = {}; ui.tagFilter = null; ui.catFilter = 'all'; ui.query = '';
        render(); toast('すべてのデータを削除しました');
      }, true);
    }

    /* ================= ヘルプ ================= */
    function openHelp() {
      openSheet(sheetHead('？ ヘルプ') + '<div class="helpbody">' +
        '<h3>このページについて</h3>' +
        '<p>自分の創作キャラクターや代理キャラクターを、1人ずつまとめておくためのページです。データはこのブラウザの中に保存されるので、閉じても残ります。お友達に渡すときは、「データ」の画面からHTMLファイルとして保存して渡してください（データは開いた人のブラウザに、その人専用で保存されます）。</p>' +
        '<h3>キャラクター</h3>' +
        '<p>「＋ キャラクターを追加」から登録できます。名前は「分けない／和名（苗字＋名前）／英名（ファミリー＋ファースト）」の3形式から選べます。分けて入力すると、名前（和名）やファーストネーム（英名）が一覧の見出しになります。フリガナは任意で、名前の上に表示され、検索でも探せます。</p>' +
        '<h3>区分とタグ</h3>' +
        '<p>区分は大きな分類です。「区分を管理」から追加・名前変更・削除ができ、キャラクターをまとめて別の区分へ移すこともできます。タグは区分とは別に自由に付けられる目印で、一覧でタップすると絞り込めます。</p>' +
        '<h3>イメージカラー</h3>' +
        '<p>色の円（カラーピッカー）から選ぶか、#からはじまるカラーコードで指定できます。「最近使用した色」や「反対色にする」も使えます。アイコン未設定のときの丸や、ヘッダー画像がないときの背景に使われます。</p>' +
        '<h3>イメージマーク</h3>' +
        '<p>キャラクターを表す絵文字や記号を、イメージカラーの下の欄から、ひとつずつ好きなだけ設定できます。よく使うマークはタップで追加でき、スマホの絵文字キーボードからも入力できます。設定したマークは、一覧・キャラクターページ・プロフィール帳表示で、イメージカラーの下に並んで表示されます。</p>' +
        '<p>マークひとつひとつに文章も付けられます。キャラクターの追加・編集画面で、各マークの「✎」を押すと、そのマーク専用の文章（由来や意味など）を書けます。文章を付けたマークには「文」の印が付き、表示画面（一覧・キャラクターページ・プロフィール帳表示、プレビュー中も）でそのマークをタップすると、文章がポップアップで出てきます。文章は検索でも探せます。</p>' +
        '<h3>ミニキャラ画像と読み込み画面</h3>' +
        '<p>キャラクターの追加・編集画面で、アイコンとは別に「ミニキャラ画像」を設定できます（背景が透明なPNGなどがおすすめです）。ページを開いたときの読み込み画面では、登録したキャラクターの中からランダムでひとりだけが、ミニキャラ画像（未設定のときはアイコンや頭文字）でぴょんぴょん出てきます。キャラクターのページを開くときの読み込み画面では、そのキャラクターのミニキャラ画像が大きく出てきます（未設定のときはアイコンや頭文字が出ます）。参考画像を大きく表示したところから「ミニキャラ画像にする」でも設定できます。</p>' +
        '<p>キャラクターの追加・編集画面の「読み込み中のひとこと」に書くと、そのキャラクターのページを開くときの読み込み画面で、「読み込み中です…」の下に小さくその文言が出ます。空欄のときは決まった文言になります。読み込み画面のバーとパーセントは、読み込みの進み具合を表します。</p>' +
        '<h3>参考画像とヘッダー・アイコン</h3>' +
        '<p>キャラクターのページで「＋ 参考画像を追加」から写真を追加できます。最初の1枚がヘッダー（ページ上部の帯）になります。画像をタップすると大きく表示され、ヘッダーやアイコンへの設定、キャプションの編集、削除ができます。「★ ヘッダーとアイコンに両方する」で同じ画像を両方に設定できます。位置の調整では、ドラッグとスライダーで表示範囲を動かせます。プロフィール帳表示で横長の画像が見切れるときは、大きく表示した画面の「プロフィール帳表示の位置を調整」から、プロフィール帳で見える範囲を画像ごとに切り抜けます（ヘッダーやアイコンの位置とは別に覚えられます）。</p>' +
        '<h3>プロンプト</h3>' +
        '<p>タイトルと本文をセットで何件でも登録でき、「コピー」ボタンで本文をそのままコピーできます。</p>' +
        '<h3>関係性</h3>' +
        '<p>ほかのキャラクターとの関係を登録できます。相手のページにも自動で表示されます。お互いへの気持ちも、向きごとに書けます。</p>' +
        '<h3>🔒 秘匿情報</h3>' +
        '<p>人に見せたくない設定はここに分けて書けます。開くときに確認が入り、プレビュー中は表示されません。</p>' +
        '<h3>並べ替え・畳む</h3>' +
        '<p>「⇅ 項目を並べ替える」を押すと、参考画像・プロンプト・リンク・関係性・🔒秘匿情報といった項目そのものの順番を、↑↓ボタンで入れ替えられます（キャラクターごとに保存されます）。各セクションの「⇅ 並べ替え」では、中身の順番を変えられます。セクションの見出しをタップすると畳んだり開いたりでき、「すべて畳む／すべて開く」も使えます。長い文章は「続きを読む」で開きます。</p>' +
        '<h3>表示の切り替え（プロフィール帳表示）</h3>' +
        '<p>キャラクターのページ上部の切り替えで、「項目ごと表示」と「📖 プロフィール帳表示」を選べます。プロフィール帳表示では、参考画像が横にスワイプできる形で大きく並び、その横に名前・区分・イメージカラー・タグ・メモ・最終更新日などの基本情報が表示されます。下に並んだ四角い項目（参考画像・プロンプト・リンク・関係性・🔒秘匿情報）をタップすると、背景がぼやけたポップアップで、その項目の中身が見られます（追加や編集もポップアップの中からできます）。最終更新日は、そのキャラクターの内容を保存したときに自動で付け替わります。選んだ表示はそのまま覚えられます。🔒秘匿情報は、プロフィール帳表示では鍵を開けているときでも中身を見せず、黒塗りのまま表示されます。</p>' +
        '<h3>デザイン</h3>' +
        '<p>「🎨 デザイン」から、シック・かわいい・ポップ・ナチュラル・ゴージャスの5種類を選べます。変わるのはまわりの枠だけで、写真やアイコン、イメージカラーは元の色のままです。</p>' +
        '<h3>プレビュー</h3>' +
        '<p>「👁 プレビュー」は見るだけの表示です。編集ボタンが隠れるので、人に見せるときや、仕上がりの確認に使えます。</p>' +
        '<h3>データの控え</h3>' +
        '<p>「データ」の画面から、データをJSONファイルに書き出したり、読み込んだりできます。ブラウザのデータを消すと中身も消えてしまうので、大事なときは控えを取っておいてください。</p>' +
        '<div class="form-actions"><button type="button" class="btn btn-primary" onclick="closeSheet()">閉じる</button></div></div>');
    }

    /* ================= 初期表示 ================= */
    render();
    /* 読み込み中画面には、一回のロードでランダムに選ばれたひとりだけを大きく出します */
    function populateLoaderChars() {
      var loader = document.getElementById('loader');
      var wrap = document.getElementById('loader-chars');
      if (!loader || !wrap) return false;
      var chars = (typeof state !== 'undefined' && state && Array.isArray(state.characters)) ? state.characters : [];
      if (!chars.length) return false;
      var c = chars[Math.floor(Math.random() * chars.length)];
      var name = headName(c);
      var h = '';
      if (c.mini && c.mini.src) {
        h = '<div class="loader-char mini solo">' +
          '<img class="loader-char-miniimg" alt="" src="' + esc(c.mini.src) + '">' +
          '<span class="loader-char-name">' + esc(name) + '</span></div>';
      } else {
        var src = null, pos = '50% 50%';
        if (c.icon && c.icon.src) {
          src = c.icon.src;
          pos = Math.round((c.icon.x == null ? .5 : c.icon.x) * 100) + '% ' + Math.round((c.icon.y == null ? .5 : c.icon.y) * 100) + '%';
        } else {
          var hi = headerImg(c);
          if (hi) {
            src = hi.src;
            var hc = c.headerCrop || { x: .5, y: .5 };
            pos = Math.round((hc.x == null ? .5 : hc.x) * 100) + '% ' + Math.round((hc.y == null ? .5 : hc.y) * 100) + '%';
          }
        }
        var inner = src
          ? '<img alt="" src="' + esc(src) + '" style="object-position:' + pos + '">'
          : '<span class="loader-char-initial" style="background:' + esc(c.color || '#888888') + '">' + esc(initialOf(c)) + '</span>';
        h = '<div class="loader-char solo">' +
          '<div class="loader-char-icon" style="border-color:' + esc(c.color || 'var(--line)') + '">' + inner + '</div>' +
          '<span class="loader-char-name">' + esc(name) + '</span></div>';
      }
      wrap.innerHTML = h;
      loader.classList.add('has-chars');
      loader.classList.add('one-char');
      var sub = loader.querySelector('.loader-sub');
      if (sub) sub.textContent = name + ' が かけつけたよ';
      return true;
    }
    /* 読み込み中画面：うちの子がいるときは少し長めに見せてから、ふわっと消します（固まったとき用の保険つき） */
    (function () {
      var hasChars = false;
      try { hasChars = populateLoaderChars(); } catch (e) { hasChars = false; }
      var loaderDone = false;
      function hideLoader() {
        if (loaderDone) return; loaderDone = true;
        finishLoaderProgress('loader');
        var l = document.getElementById('loader'); if (!l) return;
        l.classList.add('done');
        setTimeout(function () { if (l.parentNode) l.parentNode.removeChild(l); }, 650);
      }
      startLoaderProgress('loader', hasChars ? 1650 : 1050);
      setTimeout(hideLoader, hasChars ? 1650 : 1050);
      setTimeout(hideLoader, 4000);
    })();
    </script>
  </body>
</html>
