<!doctype html>
<html lang="ja" data-design="chic">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>自創作・代理まとめ HTML版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; }

      /* ---------- デザインテーマ（CSS変数） ---------- */
      :root {
        --radius: 10px; --radius-lg: 14px;
        --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
        --font-head: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
      }
      :root, :root[data-design="chic"] {
        --bg:#f7f7f5; --surface:#ffffff; --surface2:#efefec; --ink:#17171a; --ink2:#4c4d52;
        --line:#d8d8d3; --accent:#17171a; --accent-ink:#ffffff; --chip:#ececea; --danger:#b3352c;
        --radius:8px; --radius-lg:10px; --font-head:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-design="chic"] {
          --bg:#0e0e10; --surface:#17181b; --surface2:#222329; --ink:#f0f0ee; --ink2:#b0b1b6;
          --line:#35363d; --accent:#f0f0ee; --accent-ink:#141416; --chip:#232429; --danger:#e58a83;
        }
      }
      :root[data-design="kawaii"] {
        --bg:#fdf3f6; --surface:#ffffff; --surface2:#fbe9ef; --ink:#452a38; --ink2:#7d5568;
        --line:#f0cdd9; --accent:#c94f7c; --accent-ink:#ffffff; --chip:#fbe0ea; --danger:#b3352c;
        --radius:16px; --radius-lg:20px; --font-head:"M PLUS Rounded 1c","Zen Kaku Gothic New",sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-design="kawaii"] {
          --bg:#221319; --surface:#2e1a23; --surface2:#3a2230; --ink:#f9e6ee; --ink2:#d3a9bc;
          --line:#52303f; --accent:#ef9dbd; --accent-ink:#33101f; --chip:#402631; --danger:#f0a49d;
        }
      }
      :root[data-design="pop"] {
        --bg:#fdf6d3; --surface:#ffffff; --surface2:#fff3c4; --ink:#23242a; --ink2:#5a5b52;
        --line:#e7d488; --accent:#e8490f; --accent-ink:#ffffff; --chip:#ffeeb0; --danger:#c22e2e;
        --radius:12px; --radius-lg:16px; --font-head:"M PLUS Rounded 1c","Zen Kaku Gothic New",sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-design="pop"] {
          --bg:#17181f; --surface:#22232c; --surface2:#2d2e26; --ink:#f6f2df; --ink2:#b9bba6;
          --line:#45452f; --accent:#ff8a5f; --accent-ink:#2a1005; --chip:#33331f; --danger:#f09a8d;
        }
      }
      :root[data-design="natural"] {
        --bg:#f3f6ee; --surface:#ffffff; --surface2:#e9efe0; --ink:#2c382a; --ink2:#57654f;
        --line:#cfdbc0; --accent:#446b3c; --accent-ink:#ffffff; --chip:#e4edd7; --danger:#b3352c;
        --radius:12px; --radius-lg:16px; --font-head:"Zen Kaku Gothic New",sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-design="natural"] {
          --bg:#12160f; --surface:#1b2117; --surface2:#252d1f; --ink:#eaf0e2; --ink2:#aebba2;
          --line:#37422f; --accent:#9cc489; --accent-ink:#15210f; --chip:#26301f; --danger:#f0a49d;
        }
      }
      :root[data-design="gorgeous"] {
        --bg:#f7f2e6; --surface:#fffdf6; --surface2:#f1e8d0; --ink:#2b2113; --ink2:#6d5a3a;
        --line:#d9c896; --accent:#8a6a14; --accent-ink:#fff6da; --chip:#efe4c2; --danger:#a52a21;
        --radius:6px; --radius-lg:8px; --font-head:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-design="gorgeous"] {
          --bg:#0a0a09; --surface:#15140f; --surface2:#201d13; --ink:#f2e8cd; --ink2:#bfab7d;
          --line:#54451f; --accent:#cfa92e; --accent-ink:#1a1403; --chip:#26200e; --danger:#f09a8d;
        }
      }

      body {
        background: var(--bg); color: var(--ink);
        font-family: var(--font-body); font-size: 15px; line-height: 1.65;
      }
      .wrap { max-width: 1060px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 28px) 72px; }
      h1, h2, h3 { font-family: var(--font-head); line-height: 1.35; margin: 0; }
      button { font-family: inherit; cursor: pointer; }
      input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }
      a { color: var(--accent); }

      /* ---------- ボタン ---------- */
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        min-height: 40px; padding: 6px 14px; border: 1px solid var(--line);
        background: var(--surface); color: var(--ink); border-radius: var(--radius);
        font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap;
      }
      .btn:active { transform: translateY(1px); }
      .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
      .btn-small { min-height: 36px; padding: 4px 10px; font-size: 13px; }
      .btn-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
      .btn-ghost { border-color: transparent; background: transparent; }
      .btn[disabled] { opacity: .45; cursor: default; }

      /* ---------- ツールバー・検索・チップ ---------- */
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
      .searchbox { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 12px; }
      .searchbox input { flex: 1; border: none; background: transparent; min-height: 42px; outline: none; }
      .preview-badge { display: none; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
      body.preview .preview-badge { display: inline-block; }
      .chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
      .chip {
        min-height: 36px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line);
        background: var(--surface); color: var(--ink); font-size: 13.5px;
      }
      .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
      .chip .cnt { opacity: .75; font-size: 12px; margin-left: 4px; }
      .tagchip {
        display: inline-flex; align-items: center; min-height: 32px; padding: 2px 10px;
        border-radius: 999px; background: var(--chip); color: var(--ink); font-size: 13px; border: 1px solid transparent;
      }
      button.tagchip { cursor: pointer; }
      .tagchip.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
      .rowlabel { font-size: 12.5px; color: var(--ink2); margin: 2px 0 6px; letter-spacing: .04em; }

      /* ---------- 一覧カード ---------- */
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 235px), 1fr)); gap: 14px; }
      @media (max-width: 620px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
      @media (max-width: 350px) { .grid { grid-template-columns: 1fr; } }
      .card {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
        overflow: hidden; cursor: pointer; text-align: left; padding: 0; width: 100%;
        display: flex; flex-direction: column; color: var(--ink);
      }
      .card-head { aspect-ratio: 16 / 7; position: relative; flex: none; }
      .card-noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .card-noimg span { font-family: var(--font-head); font-size: 44px; font-weight: 700; color: rgba(255,255,255,.88); }
      .card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
      .card-idrow { display: flex; gap: 10px; align-items: center; }
      .card-names { min-width: 0; }
      .card-name { font-family: var(--font-head); font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card-full { font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--ink2); }
      .catbadge { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-weight: 500; color: var(--ink); }
      .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
      .card-memo { font-size: 12.5px; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

      /* ---------- 画像フレーム（切り抜き表示） ---------- */
      .cropframe { position: relative; overflow: hidden; background: var(--surface2); }
      .cropframe > img { position: absolute; max-width: none; max-height: none; display: block; }
      .cropframe.fill { position: absolute; inset: 0; }
      .iconframe { border-radius: 50%; flex: none; border: 1px solid var(--line); }
      .iconinitial {
        border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
        font-family: var(--font-head); font-weight: 700; color: rgba(255,255,255,.92); border: 1px solid var(--line);
      }

      /* ---------- キャラクターページ ---------- */
      .backrow { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
      .char-header { aspect-ratio: 16 / 7; border-radius: var(--radius-lg); border: 1px solid var(--line); position: relative; overflow: hidden; background: var(--surface2); }
      .char-header .noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .char-header .noimg span { font-family: var(--font-head); font-size: clamp(48px, 10vw, 84px); font-weight: 700; color: rgba(255,255,255,.85); }
      .header-actions { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 6px; }
      .header-actions .btn { background: var(--surface); box-shadow: 0 1px 6px rgba(0,0,0,.25); }
      .profile { display: flex; gap: 14px; align-items: center; margin: 16px 0 6px; flex-wrap: wrap; }
      .furigana { font-size: 12.5px; color: var(--ink2); letter-spacing: .14em; }
      .char-name { font-size: clamp(24px, 5.4vw, 34px); font-weight: 700; }
      .char-full { font-size: 13.5px; color: var(--ink2); }
      .colordot { display: inline-block; width: 15px; height: 15px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); vertical-align: -2px; margin-right: 5px; }
      .memobox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 12px 14px; margin: 10px 0 18px; white-space: pre-wrap; word-break: break-word; }

      .section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); margin-bottom: 14px; overflow: hidden; }
      .section-head {
        width: 100%; display: flex; align-items: center; gap: 8px; background: transparent; border: none;
        padding: 12px 14px; min-height: 48px; color: var(--ink); text-align: left;
      }
      .section-head h2 { font-size: 17px; font-weight: 700; flex: 1; }
      .section-head .cnt { font-size: 12.5px; color: var(--ink2); }
      .section-head .chev { color: var(--ink2); font-size: 13px; }
      .section-body { padding: 2px 14px 14px; }
      .section-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
      .empty-note { color: var(--ink2); font-size: 13.5px; padding: 6px 0 2px; }

      .item { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
      .item-top { display: flex; gap: 8px; align-items: flex-start; }
      .item-title { font-weight: 700; flex: 1; min-width: 0; word-break: break-word; }
      .item-btns { display: flex; gap: 5px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
      .item-body { white-space: pre-wrap; word-break: break-word; background: var(--surface2); border-radius: var(--radius); padding: 9px 11px; margin-top: 8px; font-size: 14px; }
      .clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
      .morebtn { background: none; border: none; color: var(--accent); font-size: 13px; padding: 6px 2px; min-height: 36px; font-weight: 700; }
      .movebtns { display: flex; gap: 5px; }

      .imggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 9px; }
      .imgthumb { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); padding: 0; background: var(--surface2); cursor: pointer; width: 100%; }
      .imgthumb img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
      .imgthumb .headermark { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.62); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
      .imgthumb .cap { display: block; font-size: 11.5px; color: var(--ink2); padding: 4px 7px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--surface); }

      .relcard { display: flex; gap: 11px; align-items: flex-start; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; color: var(--ink); cursor: pointer; }
      .relcard-main { flex: 1; min-width: 0; }
      .relfeel { font-size: 13px; margin-top: 5px; white-space: pre-wrap; word-break: break-word; }
      .relfeel b { font-weight: 700; }
      .locked-note { text-align: center; padding: 14px 8px 8px; color: var(--ink2); }

      /* ---------- モーダル ---------- */
      .overlay {
        position: fixed; inset: 0; background: rgba(10,10,12,.55); z-index: 60;
        display: none; align-items: flex-end; justify-content: center; padding: 0;
      }
      .overlay.open { display: flex; }
      @media (min-width: 700px) { .overlay { align-items: center; padding: 20px; } }
      .sheet {
        background: var(--surface); color: var(--ink); width: 100%; max-width: 680px;
        max-height: 92dvh; overflow-y: auto; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        padding: 18px clamp(14px, 4vw, 26px) 26px;
      }
      @media (min-width: 700px) { .sheet { border-radius: var(--radius-lg); } }
      .sheet h2 { font-size: 19px; margin-bottom: 12px; }
      .sheet h3 { font-size: 15px; margin: 18px 0 8px; }
      .field { margin-bottom: 13px; }
      .field label, .field .flabel { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
      .field .hint { font-size: 12px; color: var(--ink2); font-weight: 400; margin-top: 3px; }
      .field input[type="text"], .field input[type="url"], .field select, .field textarea {
        width: 100%; border: 1px solid var(--line); border-radius: var(--radius);
        background: var(--surface); padding: 9px 11px; min-height: 42px;
      }
      .field textarea { min-height: 84px; resize: vertical; line-height: 1.6; }
      .fieldrow { display: flex; gap: 9px; }
      .fieldrow > * { flex: 1; min-width: 0; }
      .segrow { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
      .segrow button { flex: 1; border: none; background: var(--surface); color: var(--ink2); min-height: 42px; font-size: 12.5px; padding: 4px 1px; line-height: 1.35; }
      .segrow button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
      .form-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
      .form-actions .spacer { flex: 1; }
      .namepreview { background: var(--surface2); border-radius: var(--radius); padding: 9px 12px; font-size: 13.5px; }
      .colorrow { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
      input[type="color"] { width: 56px; height: 42px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 3px; cursor: pointer; }
      .hexinput { width: 118px !important; flex: none; text-transform: lowercase; }
      .presetrow { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
      .preset { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
      .preset.on { border-color: var(--ink); transform: scale(1.08); }
      .presetname { font-size: 11.5px; color: var(--ink2); text-align: center; }
      .presetwrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .tagedit { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .tagedit .tagchip button { border: none; background: none; color: inherit; min-height: 28px; padding: 0 2px 0 5px; font-size: 14px; cursor: pointer; }
      .designcard {
        display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px;
        border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
        color: var(--ink); margin-bottom: 9px; cursor: pointer; min-height: 56px;
      }
      .designcard.on { border-color: var(--accent); border-width: 2px; }
      .designswatch { width: 40px; height: 40px; border-radius: 50%; flex: none; border: 1px solid var(--line); }
      .catrow { display: flex; gap: 7px; align-items: center; margin-bottom: 9px; }
      .catrow input { flex: 1; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; min-height: 40px; background: var(--surface); min-width: 0; }
      .helpbody p { margin: 0 0 9px; font-size: 14px; }
      .helpbody h3 { font-family: var(--font-head); }

      /* ---------- 画像ビューア・切り抜き編集 ---------- */
      .viewerbox { text-align: center; }
      .viewerbox img.big { max-width: 100%; max-height: 62dvh; border-radius: var(--radius); background: #000; }
      .viewer-cap { margin: 10px 0; white-space: pre-wrap; word-break: break-word; }
      .viewer-btns { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
      .cropstage { position: relative; overflow: hidden; background: #111; border-radius: var(--radius); margin: 0 auto; touch-action: none; max-width: 100%; }
      .cropstage img { position: absolute; max-width: none; max-height: none; display: block; cursor: grab; }
      input[type="range"] { width: 100%; min-height: 40px; accent-color: var(--accent); }

      #toast {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
        background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
        font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 99;
        max-width: 92vw; text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,.3);
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      body.preview .edit-only { display: none !important; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"></div>

    <div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
    <div id="toast" role="status"></div>
    <input type="file" id="file-imgs" accept="image/*" multiple class="sr" />
    <input type="file" id="file-icon" accept="image/*" class="sr" />
    <input type="file" id="file-import" accept="application/json,.json" class="sr" />

    <script>
    'use strict';
    /* ================= データ管理 ================= */
    var LS_KEY = 'uchinoko-htmlban-v1';
    var PRESETS = [
      { n: 'すみれ', c: '#7b6bb5' }, { n: 'ばら', c: '#c2546e' }, { n: 'こはく', c: '#d29a3c' },
      { n: 'ひすい', c: '#3f9e7a' }, { n: 'そら', c: '#4f83b8' }, { n: 'あい', c: '#3c4f8f' }
    ];
    var DESIGNS = [
      { id: 'chic', name: 'シック', desc: 'モノトーンの枠で大人っぽく。写真や色はそのまま映えます', sw: 'linear-gradient(135deg,#17171a 50%,#f7f7f5 50%)' },
      { id: 'kawaii', name: 'かわいい', desc: 'ピンクとまるみで、やさしい雰囲気に', sw: 'linear-gradient(135deg,#ef9dbd 50%,#fdf3f6 50%)' },
      { id: 'pop', name: 'ポップ', desc: '明るい色で元気いっぱいに', sw: 'linear-gradient(135deg,#e8490f 50%,#ffeeb0 50%)' },
      { id: 'natural', name: 'ナチュラル', desc: '緑と生成りの、落ち着いた雰囲気に', sw: 'linear-gradient(135deg,#446b3c 50%,#e4edd7 50%)' },
      { id: 'gorgeous', name: 'ゴージャス', desc: 'アイボリーと深い金色で豪華に（暗い画面では黒×金）', sw: 'linear-gradient(135deg,#8a6a14 50%,#f7f2e6 50%)' }
    ];
    function uid() { return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }
    function defaultState() {
      return {
        categories: [ { id: uid(), name: '自創作' }, { id: uid(), name: '代理' } ],
        characters: [], design: 'chic', recentColors: []
      };
    }
    function loadState() {
      try {
        var raw = localStorage.getItem(LS_KEY);

    function deleteCat(id) {
      var cat = state.categories.find(function (x) { return x.id === id; }); if (!cat) return;
      var n = state.characters.filter(function (c) { return c.categoryId === id; }).length;
      askConfirm('区分を削除しますか？', '区分「' + cat.name + '」を削除します。' + (n ? '\nこの区分のキャラクター' + n + '人は「未分類」になります。' : ''), '削除する', function () {
        state.categories = state.categories.filter(function (x) { return x.id !== id; });
        state.characters.forEach(function (c) { if (c.categoryId === id) c.categoryId = null; });
        if (ui.catFilter === id) ui.catFilter = 'all';
        save(); openCatManager(); render(); toast('区分を削除しました');
      }, true);
    }
    function bulkMove() {
      var from = document.getElementById('mv-from').value, to = document.getElementById('mv-to').value;
      if (from === to) { toast('移動元と移動先が同じです'); return; }
      var n = 0;
      state.characters.forEach(function (c) { if (c.categoryId === from) { c.categoryId = to; n++; } });
      save(); openCatManager(); render(); toast(n + '人を移動しました');
    }

    /* ================= デザイン選択 ================= */
    function openDesignPicker() {
      var h = sheetHead('🎨 デザインを選ぶ') + '<p style="font-size:13.5px;color:var(--ink2);margin:0 0 12px">まわりの枠の雰囲気が変わります。写真・アイコン・イメージカラーは、どのデザインでも元の色のまま表示されます。</p>';
      DESIGNS.forEach(function (d) {
        h += '<button type="button" class="designcard' + (state.design === d.id ? ' on' : '') + '" onclick="pickDesign(\'' + d.id + '\')">' +
          '<span class="designswatch" style="background:' + d.sw + '"></span>' +
          '<span><b>' + esc(d.name) + '</b><br><span style="font-size:13px;color:var(--ink2)">' + esc(d.desc) + '</span></span></button>';
      });
      h += '<div class="form-actions"><button type="button" class="btn" onclick="closeSheet()">閉じる</button></div>';
      openSheet(h);
      sheetEl.scrollIntoView({ block: 'nearest' });
    }
    function pickDesign(id) {
      state.design = id; save(); closeSheet(); render();
      var d = DESIGNS.find(function (x) { return x.id === id; });
      toast('デザインを「' + (d ? d.name : id) + '」にしました');
    }

    /* ================= データ管理 ================= */
    function openDataMenu() {
      var size = 0;
      try { size = (localStorage.getItem(LS_KEY) || '').length; } catch (e) {}
      var h = sheetHead('データ') +
        '<p style="font-size:14px">このページのデータは、このブラウザの中に保存されています。閉じても残りますが、ブラウザのデータを消すと一緒に消えてしまいます。大事なデータは、ときどき書き出して控えを取っておくのがおすすめです。</p>' +
        '<p style="font-size:13px;color:var(--ink2)">現在のデータ量の目安：約 ' + Math.max(1, Math.round(size / 1024)) + ' KB</p>' +
        '<h3>控えを取る・戻す</h3>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button type="button" class="btn" onclick="exportData()">データを書き出す（JSON）</button>' +
        '<button type="button" class="btn" onclick="document.getElementById(\'file-import\').click()">書き出したデータを読み込む</button></div>' +
        '<p class="hint" style="font-size:12px;color:var(--ink2)">読み込むと、今のデータは読み込んだ内容に置き換わります。</p>' +
        '<h3>このページ自体を保存</h3>' +
        '<p style="font-size:14px">このページをHTMLファイルとして保存できます。保存したファイルは、ブラウザで開くだけで同じように使えます（データは開いた人のブラウザに保存されます）。</p>' +
        '<button type="button" class="btn" onclick="downloadSelf()">HTMLファイルとして保存する</button>' +
        '<h3>すべて消す</h3>' +
        '<button type="button" class="btn btn-danger" onclick="askWipe()">すべてのデータを削除</button>' +
        '<div class="form-actions"><button type="button" class="btn" onclick="closeSheet()">閉じる</button></div>';
      openSheet(h);
    }
    function downloadBlob(blob, filename) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 400);
    }
    function exportData() {
      downloadBlob(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }), 'uchinoko-matome-data.json');
      toast('データを書き出しました');
    }
    document.getElementById('file-import').addEventListener('change', function (e) {
      var f = (e.target.files || [])[0]; e.target.value = '';
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var s = JSON.parse(reader.result);
          if (!s || !Array.isArray(s.characters) || !Array.isArray(s.categories)) throw new Error('bad');
          askConfirm('データを読み込みますか？', '今のデータは、読み込んだ内容に置き換わります。よろしいですか？', '読み込む', function () {
            state = s; save(); ui.view = 'list'; ui.charId = null; ui.tagFilter = null; ui.catFilter = 'all';
            render(); toast('データを読み込みました');
          });
        } catch (err) { toast('そのファイルは読み込めませんでした'); }
      };
      reader.readAsText(f);
    });
    function downloadSelf() {
      var html = '<!doctype html>\n' + document.documentElement.outerHTML;
      downloadBlob(new Blob([html], { type: 'text/html' }), 'uchinoko-matome.html');
      toast('HTMLファイルを保存しました');
    }
    function askWipe() {
      askConfirm('すべてのデータを削除しますか？', 'キャラクター・区分・設定のすべてが消えます。元に戻せません。', 'すべて削除する', function () {
        state = defaultState(); save();
        ui.view = 'list'; ui.charId = null; ui.unlocked = {}; ui.tagFilter = null; ui.catFilter = 'all'; ui.query = '';
        render(); toast('すべてのデータを削除しました');
      }, true);
    }

    /* ================= ヘルプ ================= */
    function openHelp() {
      openSheet(sheetHead('？ ヘルプ') + '<div class="helpbody">' +
        '<h3>このページについて</h3>' +
        '<p>自分の創作キャラクターや代理キャラクターを、1人ずつまとめておくためのページです。データはこのブラウザの中に保存されるので、閉じても残ります。お友達に渡すときは、「データ」の画面からHTMLファイルとして保存して渡してください（データは開いた人のブラウザに、その人専用で保存されます）。</p>' +
        '<h3>キャラクター</h3>' +
        '<p>「＋ キャラクターを追加」から登録できます。名前は「分けない／和名（苗字＋名前）／英名（ファミリー＋ファースト）」の3形式から選べます。分けて入力すると、名前（和名）やファーストネーム（英名）が一覧の見出しになります。フリガナは任意で、名前の上に表示され、検索でも探せます。</p>' +
        '<h3>区分とタグ</h3>' +
        '<p>区分は大きな分類です。「区分を管理」から追加・名前変更・削除ができ、キャラクターをまとめて別の区分へ移すこともできます。タグは区分とは別に自由に付けられる目印で、一覧でタップすると絞り込めます。</p>' +
        '<h3>イメージカラー</h3>' +
        '<p>色の円（カラーピッカー）から選ぶか、#からはじまるカラーコードで指定できます。「最近使用した色」や「反対色にする」も使えます。アイコン未設定のときの丸や、ヘッダー画像がないときの背景に使われます。</p>' +
        '<h3>参考画像とヘッダー・アイコン</h3>' +
        '<p>キャラクターのページで「＋ 参考画像を追加」から写真を追加できます。最初の1枚がヘッダー（ページ上部の帯）になります。画像をタップすると大きく表示され、ヘッダーやアイコンへの設定、キャプションの編集、削除ができます。「★ ヘッダーとアイコンに両方する」で同じ画像を両方に設定できます。位置の調整では、ドラッグとスライダーで表示範囲を動かせます。</p>' +
        '<h3>プロンプト</h3>' +
        '<p>タイトルと本文をセットで何件でも登録でき、「コピー」ボタンで本文をそのままコピーできます。</p>' +
        '<h3>関係性</h3>' +
        '<p>ほかのキャラクターとの関係を登録できます。相手のページにも自動で表示されます。お互いへの気持ちも、向きごとに書けます。</p>' +
        '<h3>🔒 秘匿情報</h3>' +
        '<p>人に見せたくない設定はここに分けて書けます。開くときに確認が入り、プレビュー中は表示されません。</p>' +
        '<h3>並べ替え・畳む</h3>' +
        '<p>「⇅ 項目を並べ替える」を押すと、参考画像・プロンプト・リンク・関係性・🔒秘匿情報といった項目そのものの順番を、↑↓ボタンで入れ替えられます（キャラクターごとに保存されます）。各セクションの「⇅ 並べ替え」では、中身の順番を変えられます。セクションの見出しをタップすると畳んだり開いたりでき、「すべて畳む／すべて開く」も使えます。長い文章は「続きを読む」で開きます。</p>' +
        '<h3>デザイン</h3>' +
        '<p>「🎨 デザイン」から、シック・かわいい・ポップ・ナチュラル・ゴージャスの5種類を選べます。変わるのはまわりの枠だけで、写真やアイコン、イメージカラーは元の色のままです。</p>' +
        '<h3>プレビュー</h3>' +
        '<p>「👁 プレビュー」は見るだけの表示です。編集ボタンが隠れるので、人に見せるときや、仕上がりの確認に使えます。</p>' +
        '<h3>データの控え</h3>' +
        '<p>「データ」の画面から、データをJSONファイルに書き出したり、読み込んだりできます。ブラウザのデータを消すと中身も消えてしまうので、大事なときは控えを取っておいてください。</p>' +
        '<div class="form-actions"><button type="button" class="btn btn-primary" onclick="closeSheet()">閉じる</button></div></div>');
    }

    /* ================= 初期表示 ================= */
    render();
    </script>
  </body>
</html>
